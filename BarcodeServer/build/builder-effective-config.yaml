directories:
  output: build
  buildResources: build
appId: com.barcodescanner.server
productName: 包裹管理系统
files:
  - filter:
      - main.js
      - preload.js
      - server.js
      - package.json
      - dashboard/**/*
      - public/**/*
extraResources:
  - from: node_modules
    to: node_modules
    filter:
      - '**/*'
win:
  target: portable
  artifactName: ${productName}-${version}-便携版.${ext}
portable:
  artifactName: ${productName}-${version}-便携版.exe
  requestExecutionLevel: user
  unpackDirName: 包裹管理系统-数据
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 包裹管理系统
electronVersion: 28.0.0
